<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Coming Soon</title>
    <!-- Temporary pre-launch gate. Enter the 4-digit access code to reach the
         site; Assets/site-gate.js on every other page sends visitors here
         until they have. Employees sign in separately via the footer's
         "Employee Login" link (/dashboard/). -->
    <script>
        // Already entered the code on this device? Skip straight to the site.
        (function () {
            try {
                if (localStorage.getItem('dl_access') === 'granted-v1') {
                    var params = new URLSearchParams(location.search);
                    var next = params.get('next');
                    location.replace(next && next.charAt(0) === '/' && next.charAt(1) !== '/' ? next : '/home/');
                }
            } catch (e) {}
        })();
    </script>
    <style>
        html, body {
            height: 100%; margin: 0; background: #1a1a1a; color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            display: flex; align-items: center; justify-content: center; text-align: center;
        }
        .msg { padding: 24px; width: 100%; max-width: 420px; box-sizing: border-box; }
        h1 {
            margin: 0; font-size: clamp(24px, 5vw, 34px); font-weight: 600;
            letter-spacing: 0.5px;
        }
        .sub { margin: 14px 0 0; color: rgba(255,255,255,0.6); font-size: 17px; }

        .code-form { margin-top: 40px; }
        .code-form label { display: block; font-size: 18px; margin-bottom: 14px; color: rgba(255,255,255,0.85); }
        .code-input {
            width: 220px; max-width: 100%; box-sizing: border-box; padding: 14px 10px;
            font-size: 40px; letter-spacing: 16px; text-align: center; text-indent: 16px;
            background: #111; color: #fff; border: 2px solid rgba(255,255,255,0.35); border-radius: 10px;
            font-variant-numeric: tabular-nums;
        }
        .code-input:focus { outline: none; border-color: #ffffff; }
        .code-submit {
            display: block; margin: 18px auto 0; padding: 14px 40px; border: none; border-radius: 10px;
            background: #ffffff; color: #1a1a1a; font-size: 18px; font-weight: 700; cursor: pointer;
        }
        .code-submit:disabled { opacity: 0.5; cursor: default; }
        .code-error { margin: 16px 0 0; font-size: 17px; color: #ffb4b4; min-height: 1.4em; }

        [hidden] { display: none !important; }
    </style>
</head>
<body>
    <div class="msg">
        <h1>Something big is coming soon.</h1>
        <p class="sub">Check back shortly.</p>

        <form class="code-form" id="code-form" autocomplete="off">
            <label for="code-input">Have an access code?</label>
            <input class="code-input" id="code-input" type="text" inputmode="numeric" pattern="[0-9]*"
                   maxlength="4" placeholder="····" aria-describedby="code-error" required>
            <button class="code-submit" type="submit">Enter</button>
            <p class="code-error" id="code-error" role="alert"></p>
        </form>
    </div>

    <script>
        (function () {
            // FNV-1a hash of the code, so it isn't sitting in plain text in
            // the page source. Not real security (see Assets/site-gate.js).
            var CODE_HASH = 0x36e7da04;
            function hash(s) {
                var h = 0x811c9dc5;
                for (var i = 0; i < s.length; i++) {
                    h ^= s.charCodeAt(i);
                    h = Math.imul(h, 0x01000193) >>> 0;
                }
                return h >>> 0;
            }

            var form = document.getElementById('code-form');
            var input = document.getElementById('code-input');
            var errorEl = document.getElementById('code-error');
            input.focus();

            function nextPage() {
                var next = new URLSearchParams(location.search).get('next');
                // Only same-site paths, never "//other-site.com".
                return next && next.charAt(0) === '/' && next.charAt(1) !== '/' ? next : '/home/';
            }

            function tryCode() {
                var code = input.value.replace(/\D/g, '');
                if (code.length !== 4) {
                    errorEl.textContent = 'Please enter all 4 numbers.';
                    return;
                }
                if (hash('design-lab:' + code) !== CODE_HASH) {
                    errorEl.textContent = "That code didn't work. Please try again.";
                    input.value = '';
                    input.focus();
                    return;
                }
                try { localStorage.setItem('dl_access', 'granted-v1'); } catch (e) {}
                location.replace(nextPage());
            }

            input.addEventListener('input', function () {
                input.value = input.value.replace(/\D/g, '').slice(0, 4);
                errorEl.textContent = '';
                if (input.value.length === 4) tryCode();
            });
            form.addEventListener('submit', function (e) {
                e.preventDefault();
                tryCode();
            });
        })();
    </script>
</body>
</html>
