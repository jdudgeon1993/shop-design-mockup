<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Design Lab — Coming Soon</title>
    <!-- Temporary pre-launch gate. Enter the 4-digit access code to reach the
         site; Assets/site-gate.js on every other page sends visitors here
         until they have. Employees sign in separately via the footer's
         "Employee Login" link (/dashboard/). -->
    <script>
        // Already entered the code on this device? Skip straight to the site.
        (function () {
            try {
                if (localStorage.getItem('dl_access') === 'granted-v1') {
                    var next = new URLSearchParams(location.search).get('next');
                    location.replace(next && next.charAt(0) === '/' && next.charAt(1) !== '/' ? next : '/home/');
                }
            } catch (e) {}
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #d4af37; --gold-soft: rgba(212, 175, 55, 0.55); --black: #121212; }
        html { background: var(--black); }
        html, body { height: 100%; margin: 0; color: #fff; }
        body {
            font-family: 'Montserrat', sans-serif; overflow: hidden;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center;
        }

        /* Kitchen photo, slowly drifting, under a dark vignette so the type pops. */
        .backdrop {
            position: fixed; inset: -4%; z-index: -2;
            background: url('/Assets/Images/hero-section-i1.png') center / cover no-repeat;
            animation: drift 28s ease-in-out infinite alternate;
        }
        .shade {
            position: fixed; inset: 0; z-index: -1;
            background:
                radial-gradient(ellipse at center, rgba(18,18,18,0.62) 0%, rgba(18,18,18,0.80) 60%, rgba(18,18,18,0.94) 100%);
        }
        @keyframes drift { from { transform: scale(1); } to { transform: scale(1.08) translate(-1%, -1%); } }

        main { padding: 24px; width: 100%; max-width: 760px; box-sizing: border-box; }
        .logo {
            width: min(520px, 82vw); height: auto; display: block; margin: 0 auto;
            animation: rise 1.2s ease-out both;
        }
        .rule {
            width: 0; height: 1px; margin: 44px auto 34px; background: var(--gold);
            animation: grow 1.1s 0.6s ease-out forwards;
        }
        h1 {
            margin: 0; font-family: 'Playfair Display', serif; font-weight: 600;
            font-size: clamp(44px, 9vw, 92px); line-height: 1; letter-spacing: 1px;
            animation: rise 1.2s 0.4s ease-out both;
        }
        h1 em { color: var(--gold); font-style: italic; }
        .sub {
            margin: 22px 0 0; font-size: clamp(13px, 2vw, 15px); font-weight: 300;
            letter-spacing: 4px; text-transform: uppercase; color: rgba(255,255,255,0.72);
            animation: rise 1.2s 0.8s ease-out both;
        }
        @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
        @keyframes grow { to { width: 96px; } }

        /* The access code: small and quiet, tucked at the bottom. */
        .access {
            position: fixed; left: 0; right: 0; bottom: 28px;
            display: flex; flex-direction: column; align-items: center; gap: 10px;
            animation: rise 1.2s 1.4s ease-out both;
        }
        .access-toggle {
            background: none; border: none; cursor: pointer; padding: 6px 10px;
            font: 400 14px 'Montserrat', sans-serif; letter-spacing: 1px;
            color: rgba(255,255,255,0.6);
        }
        .access-toggle:hover, .access-toggle:focus-visible { color: var(--gold); outline: none; }
        .access-form { display: flex; align-items: center; gap: 8px; }
        .code-input {
            width: 108px; box-sizing: border-box; padding: 9px 8px;
            font: 600 20px 'Montserrat', sans-serif; letter-spacing: 8px; text-align: center; text-indent: 8px;
            background: rgba(0,0,0,0.45); color: #fff;
            border: 1px solid var(--gold-soft); border-radius: 6px;
        }
        .code-input::placeholder { color: rgba(255,255,255,0.35); }
        .code-input:focus { outline: none; border-color: var(--gold); }
        .code-submit {
            padding: 10px 16px; border: 1px solid var(--gold); border-radius: 6px; cursor: pointer;
            background: transparent; color: var(--gold); font: 600 14px 'Montserrat', sans-serif; letter-spacing: 1px;
        }
        .code-submit:hover, .code-submit:focus-visible { background: var(--gold); color: var(--black); outline: none; }
        .code-error { margin: 0; min-height: 1.3em; font-size: 14px; color: #ffc2c2; }

        @media (prefers-reduced-motion: reduce) {
            .backdrop, .logo, .rule, h1, .sub, .access { animation: none; }
            .rule { width: 96px; }
        }
        @media (max-height: 560px) { .rule { margin: 24px auto 20px; } .access { bottom: 12px; } }

        [hidden] { display: none !important; }
    </style>
</head>
<body>
    <div class="backdrop" aria-hidden="true"></div>
    <div class="shade" aria-hidden="true"></div>

    <main>
        <img class="logo" src="/Assets/Logos/Hero-Logo%202.0.png"
             alt="Design Lab — Online cabinetry. Customer focused. Best flippin' home on the block.">
        <div class="rule" aria-hidden="true"></div>
        <h1>Coming <em>Soon</em></h1>
        <p class="sub">Something big is on the way</p>
    </main>

    <div class="access">
        <button class="access-toggle" id="access-toggle" type="button" aria-expanded="false" aria-controls="access-form">
            Have an access code?
        </button>
        <form class="access-form" id="access-form" autocomplete="off" hidden>
            <input class="code-input" id="code-input" type="text" inputmode="numeric" pattern="[0-9]*"
                   maxlength="4" placeholder="····" aria-label="4-digit access code" aria-describedby="code-error">
            <button class="code-submit" type="submit">Enter</button>
        </form>
        <p class="code-error" id="code-error" role="alert"></p>
    </div>

    <script>
        (function () {
            // FNV-1a hash of the code, so it isn't sitting in plain text in
            // the page source. Not real security (see Assets/site-gate.js).
            var CODE_HASH = 0x36e7da04;
            function hash(s) {
                var h = 0x811c9dc5;
                for (var i = 0; i < s.length; i++) {
                    h ^= s.charCodeAt(i);
                    h = Math.imul(h, 0x01000193) >>> 0;
                }
                return h >>> 0;
            }

            var toggle = document.getElementById('access-toggle');
            var form = document.getElementById('access-form');
            var input = document.getElementById('code-input');
            var errorEl = document.getElementById('code-error');

            toggle.addEventListener('click', function () {
                var open = form.hidden;
                form.hidden = !open;
                toggle.setAttribute('aria-expanded', String(open));
                errorEl.textContent = '';
                if (open) input.focus();
            });

            function nextPage() {
                var next = new URLSearchParams(location.search).get('next');
                // Only same-site paths, never "//other-site.com".
                return next && next.charAt(0) === '/' && next.charAt(1) !== '/' ? next : '/home/';
            }

            function tryCode() {
                var code = input.value.replace(/\D/g, '');
                if (code.length !== 4) {
                    errorEl.textContent = 'Please enter all 4 numbers.';
                    return;
                }
                if (hash('design-lab:' + code) !== CODE_HASH) {
                    errorEl.textContent = "That code didn't work. Please try again.";
                    input.value = '';
                    input.focus();
                    return;
                }
                try { localStorage.setItem('dl_access', 'granted-v1'); } catch (e) {}
                location.replace(nextPage());
            }

            input.addEventListener('input', function () {
                input.value = input.value.replace(/\D/g, '').slice(0, 4);
                errorEl.textContent = '';
                if (input.value.length === 4) tryCode();
            });
            form.addEventListener('submit', function (e) {
                e.preventDefault();
                tryCode();
            });
        })();
    </script>
</body>
</html>
