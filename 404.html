<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Page not found - Design Lab</title>
    <meta name="theme-color" content="#2b211b">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="/Assets/Logos/apple-touch-icon.png">
    <link rel="stylesheet" href="/Assets/dl-theme.css">
    <link rel="stylesheet" href="/Assets/dl-header.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Libre+Caslon+Display&display=swap" rel="stylesheet">
    <!-- GitHub Pages serves this for any path that doesn't exist. Absolute asset
         paths only: the URL could be at any depth. -->
    <style>
        html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-body); }
        main { max-width: 1100px; margin: 0 auto; padding: 72px 5% 96px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 56px; align-items: center; }
        .code { margin: 0; color: var(--gold); font-size: 12px; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; }
        h1 { margin: 12px 0 16px; font-family: var(--font-display); font-weight: 400; font-size: clamp(36px, 6vw, 60px); line-height: 1.05; text-wrap: balance; }
        h1 em { color: var(--gold); font-style: normal; }
        p.lead { margin: 0 0 30px; color: rgba(var(--ink), .68); font-size: 16px; line-height: 1.65; max-width: 46ch; }
        .links { display: flex; flex-wrap: wrap; gap: 10px; }
        .links a {
            display: inline-flex; align-items: center; min-height: 46px; padding: 0 22px; border-radius: 999px;
            border: 1px solid rgba(var(--ink), .22); color: var(--text); text-decoration: none;
            font-size: 12.5px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase;
        }
        .links a.primary { background: var(--gold); border-color: var(--gold); color: var(--on-gold); }
        .links a:hover, .links a:focus-visible { border-color: var(--gold); outline: none; }
        figure { margin: 0; border-radius: 18px; overflow: hidden; aspect-ratio: 4 / 3; background: var(--sunk); }
        figure img { width: 100%; height: 100%; object-fit: cover; display: block; }
        @media (max-width: 820px) { main { grid-template-columns: minmax(0, 1fr); padding-top: 40px; gap: 32px; } figure { order: -1; aspect-ratio: 16 / 9; } }
    </style>
</head>
<body>
    <script src="/Assets/dl-header.js"></script>
    <main>
        <div>
            <p class="code">Page not found</p>
            <h1>This page is <em>off the plan.</em></h1>
            <p class="lead">We couldn't find what you were looking for. It may have moved, or the link may be mistyped.</p>
            <div class="links">
                <a class="primary" href="/home/">Go to the home page</a>
                <a href="/diy-wizard/">DIY Shop</a>
                <a href="/collections/">Curated Collections</a>
            </div>
        </div>
        <figure><img src="/Assets/Images/diy-section.webp" alt="" loading="lazy"></figure>
    </main>
    <script src="/Assets/dl-footer.js"></script>
</body>
</html>
