<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Page not found - Design Lab</title>
    <meta name="theme-color" content="#1a1a1a">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="/Assets/Logos/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    <!-- GitHub Pages serves this for any path that doesn't exist. Absolute asset
         paths only: the URL could be at any depth. -->
    <style>
        :root { --gold: #d4af37; --black: #1a1a1a; }
        html, body { height: 100%; margin: 0; background: var(--black); color: #fff; font-family: 'Montserrat', sans-serif; }
        body { display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; box-sizing: border-box; }
        main { max-width: 560px; }
        .logo { width: min(360px, 76vw); height: auto; display: block; margin: 0 auto 40px; }
        .code { margin: 0; color: var(--gold); font-size: 13px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; }
        h1 { margin: 10px 0 14px; font-family: 'Playfair Display', serif; font-weight: 600; font-size: clamp(32px, 6vw, 52px); }
        h1 em { color: var(--gold); }
        p { margin: 0 0 30px; color: rgba(255,255,255,0.65); font-size: 16px; line-height: 1.6; }
        .links { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
        .links a {
            padding: 12px 22px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.2); color: #fff; text-decoration: none;
            font-size: 13px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
        }
        .links a.primary { background: var(--gold); border-color: var(--gold); color: var(--black); }
        .links a:hover, .links a:focus-visible { border-color: var(--gold); outline: none; }
    </style>
</head>
<body>
    <main>
        <img class="logo" src="/Assets/Logos/hero-logo.webp" alt="Design Lab">
        <p class="code">404</p>
        <h1>This page is <em>off the plan.</em></h1>
        <p>We couldn't find what you were looking for. It may have moved, or the link may be mistyped.</p>
        <div class="links">
            <a class="primary" href="/home/">Go to the homepage</a>
            <a href="/diy-wizard/">DIY Shop</a>
            <a href="/collections/">Collections</a>
        </div>
    </main>
</body>
</html>
